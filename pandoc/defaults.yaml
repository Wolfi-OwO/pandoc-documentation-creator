########
# Pandoc Defaults
# ---
# Built into the Docker image. Users usually only need `metadata.yaml`.

########
# Input Format
# ---
# Enabled Markdown extensions for the document source.
from: markdown+yaml_metadata_block+fenced_code_blocks+backtick_code_blocks+fenced_code_attributes+inline_code_attributes+implicit_figures+table_captions+footnotes+smart+pipe_tables+grid_tables

########
# Output Format
# ---
# Generate PDF output through LaTeX.
to: pdf

########
# Template
# ---
# Main LaTeX template used for document rendering.
template: /usr/local/share/pandoc/templates/custom-template.tex

########
# PDF Engine
# ---
# XeLaTeX gives strong Unicode and font support.
pdf-engine: xelatex

########
# Filters
# ---
# External filters executed in order.
filters:
  - /usr/local/bin/pandoc-kroki-filter
  - /usr/local/share/pandoc/filters/diagram-size.lua
  - /usr/local/share/pandoc/filters/columns.lua

########
# Table Of Contents
# ---
# Enabled by default and can be adjusted in metadata.
table-of-contents: true

########
# Section Numbering
# ---
# Enabled by default and can be adjusted in metadata.
number-sections: true

########
# Highlight Style
# ---
# Default syntax highlighting theme.
highlight-style: /usr/local/share/pandoc/styles/code/vscode-light.theme

########
# Template Variables
# ---
# Base defaults passed into the custom LaTeX template.
variables:
  ########
  # Listings
  # ---
  # Use the LaTeX `listings` package for code blocks.
  listings: false

  ########
  # Document Class
  # ---
  # Default KOMA-Script article class.
  documentclass: scrartcl

  ########
  # Page Defaults
  # ---
  # Base paper size and typography defaults.
  papersize: a4
  fontsize: 11pt
  linestretch: 1.15

  ########
  # Geometry
  # ---
  # Default page margins.
  geometry:
    - left=2.5cm
    - right=2.5cm
    - top=2.5cm
    - bottom=2.5cm

  ########
  # Header Includes
  # ---
  # Additional LaTeX injected into the preamble.
  header-includes: |
    \input{/usr/local/share/pandoc/templates/header.tex}

########
# Resource Paths
# ---
# Locations Pandoc searches for images and related assets.
resource-path:
  - /data
  - /data/media
  - /data/chapters
  - /data/images

########
# Standalone Mode
# ---
# Produce a self-contained LaTeX document.
standalone: true

########
# Tab Preservation
# ---
# Keep literal tabs in code blocks.
preserve-tabs: true

########
# Tab Stop
# ---
# Number of spaces represented by a tab.
tab-stop: 4

########
# Warning Handling
# ---
# Warnings do not fail the build by default.
fail-if-warnings: false

########
# Comment Handling
# ---
# Preserve comments in the generated output.
strip-comments: false

########
# Media Extraction
# ---
# Extract generated media relative to the build directory.
extract-media: .
