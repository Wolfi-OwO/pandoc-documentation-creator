# Pandoc defaults configuration - Built into Docker image
# Users only need to provide metadata.yaml

# Input format with enabled extensions
from: markdown+yaml_metadata_block+fenced_code_blocks+backtick_code_blocks+fenced_code_attributes+inline_code_attributes+implicit_figures+table_captions+footnotes+smart+pipe_tables+grid_tables

# Output format  
to: pdf

# Template to use
template: /usr/local/share/pandoc/templates/custom-template.tex

# PDF engine
pdf-engine: xelatex

# Filters (executed in order)
filters:
  - /usr/local/bin/pandoc-kroki-filter

# Table of contents
table-of-contents: true

# Number sections
number-sections: true

# Highlight style
highlight-style: /usr/local/share/pandoc/styles/code/vscode-light.theme

# Variables for template
variables:
  # Use listings for code blocks
  listings: false
  
  # Document class
  documentclass: scrartcl
  
  # Paper and font settings
  papersize: a4
  fontsize: 11pt
  linestretch: 1.15
  
  # Geometry
  geometry:
    - left=2.5cm
    - right=2.5cm
    - top=2.5cm
    - bottom=2.5cm
  
  # Header includes
  header-includes: |
    \input{/usr/local/share/pandoc/templates/header.tex}

# Resource path for images
resource-path:
  - /data
  - /data/media
  - /data/chapters
  - /data/images

# Standalone document
standalone: true

# Preserve tabs in code blocks
preserve-tabs: true

# Tab stops (spaces)
tab-stop: 4

# Fail on warnings
fail-if-warnings: false

# Strip comments
strip-comments: false
