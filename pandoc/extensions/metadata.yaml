########
# Metadata Defaults
# ---
# Internal default metadata values that can be overridden by project metadata.

########
# Document Identity
# ---
title: "Documentation"
author: "Your Name"
date: ""

########
# Automatic Date Formatting
# ---
date-style: ""
date-format: ""

########
# Language And Localization
# ---
lang: "de-AT"

########
# Document Class
# ---
documentclass: "scrartcl"

########
# Fonts
# ---
mainfont: "Liberation Serif"
sansfont: "Liberation Sans"
monofont: "Liberation Mono"

########
# Page Layout
# ---
papersize: "a4"
fontsize: "11pt"
linestretch: "1.15"

########
# Geometry
# ---
geometry:
  - "left=2.5cm"
  - "right=2.5cm"
  - "top=2cm"
  - "bottom=2cm"

########
# Colors
# ---
linkcolor: "blue"
urlcolor: "blue"
citecolor: "brown"

########
# Abstract
# ---
abstract: ""

########
# Contents And Listings
# ---
toc: true
toc-depth: 3
listings: false

########
# Bibliography
# ---
biblatex: true
bibliography: references.bib

########
# Section Numbering
# ---
number-sections: true

########
# Code Line Numbers
# ---
show-code-line-numbers: true
