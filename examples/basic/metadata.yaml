########
# Metadata Overview
# ---
# Basic example metadata for a generated document.

########
# Document Identity
# ---
title: "Example Documentation"
subtitle: "Basic Example"
author: "Your Name"
date: ""

########
# Automatic Date Formatting
# ---
# Example:
# date-style: "ddmmyyyy"
# date-format: "%d.%m.%Y"
date-style: ""
date-format: ""

########
# Language And Localization
# ---
# Example:
# lang: "de-AT"
# polyglossia-lang: "german"
# polyglossia-variant: "austrian"
lang: "de-AT"

########
# Visual Theme
# ---
# "modern" (default), "classic" (plain booktabs), or "minimal".
pdf-theme: "modern"

########
# Document Class
# ---
documentclass: "scrartcl"

########
# Fonts
# ---
mainfont: "Liberation Serif"
sansfont: "Liberation Sans"
monofont: "Liberation Mono"

########
# Page Layout
# ---
papersize: "a4"
fontsize: "11pt"
linestretch: 1.15

########
# Colors
# ---
# Optional table color overrides (6-digit hex):
# table-header-color: "E8ECF4"
# table-accent-color: "475577"
# table-row-color: "F5F5F5"
linkcolor: "blue"
urlcolor: "blue"
citecolor: "brown"
toccolor: "black"

########
# Abstract
# ---
abstract: ""

########
# Table Of Contents
# ---
toc-title: "Table of Contents"
lof: false
lot: false
toc-depth: 3

########
# Section Numbering
# ---
numbersections: true
secnumdepth: 3

########
# Header And Footer Content
# ---
header-left: ""
header-center: ""
header-right: \DTMtoday
footer-left: ""
footer-center: ""
footer-right: \pagemark
