stages:
  - build
  - release

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  DOCKER_LATEST_TAG: $CI_REGISTRY_IMAGE:latest
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

build_and_push_docker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  before_script:
    - echo "Logging into GitLab Container Registry..."
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - echo "Building Docker image with tag $CI_COMMIT_TAG"
    - |
      docker build \
        --build-arg VERSION="${CI_COMMIT_TAG#v}" \
        --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        --build-arg VCS_URL="$CI_PROJECT_URL" \
        -t $DOCKER_IMAGE_NAME \
        -t $DOCKER_LATEST_TAG \
        -f Dockerfile .
    - echo "Pushing image to GitLab Container Registry..."
    - docker push $DOCKER_IMAGE_NAME
    - docker push $DOCKER_LATEST_TAG
    - echo "Successfully pushed $DOCKER_IMAGE_NAME and $DOCKER_LATEST_TAG"
  after_script:
    - docker logout $CI_REGISTRY || true

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: |
      Release $CI_COMMIT_TAG of Pandoc Documentation Creator
      
      Docker Image: `$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG`
      
      ## Features
      - VSCode Light Theme syntax highlighting
      - Mermaid diagram support
      - PlantUML diagram support
      - Modern professional PDF layout
      - A4 page format with proper margins
      
      ## Usage
      ```bash
      docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
      
      docker run --rm -v $(pwd):/data $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG \
        example/deckblatt.md example/documentation.md \
        --template=custom-template.tex \
        --highlight-style=/usr/local/share/pandoc/templates/styles/code/vscode-light.theme \
        --pdf-engine=xelatex \
        --toc \
        --number-sections \
        --filter pandoc-plantuml \
        --filter pandoc-mermaid \
        -o /data/output/documentation.pdf
      ```
