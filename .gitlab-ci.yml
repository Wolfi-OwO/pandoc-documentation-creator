stages:
  - build
  - release

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  DOCKER_LATEST_TAG: $CI_REGISTRY_IMAGE:latest
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

build_and_push_docker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/
  before_script:
    - echo "Logging into GitLab Container Registry..."
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - echo "Building Docker image with tag $CI_COMMIT_TAG"
    - |
      docker build \
        --build-arg VERSION="${CI_COMMIT_TAG#v}" \
        --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        --build-arg VCS_URL="$CI_PROJECT_URL" \
        -t $DOCKER_IMAGE_NAME \
        -t $DOCKER_LATEST_TAG \
        -f docker/Dockerfile .
    - echo "Pushing image to GitLab Container Registry..."
    - docker push $DOCKER_IMAGE_NAME
    - docker push $DOCKER_LATEST_TAG
    - echo "Successfully pushed $DOCKER_IMAGE_NAME and $DOCKER_LATEST_TAG"
  after_script:
    - docker logout $CI_REGISTRY || true

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  before_script:
    - apk add --no-cache git
  script:
    - echo "Creating release $CI_COMMIT_TAG"
    - |
      # Get the previous tag
      PREV_TAG=$(git describe --tags --abbrev=0 $CI_COMMIT_TAG^ 2>/dev/null || echo "")
      
      # Generate changelog
      if [ -z "$PREV_TAG" ]; then
        echo "## Changes" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        git log --pretty=format:"- %s (%h)" $CI_COMMIT_TAG >> CHANGELOG.md
      else
        echo "## Changes since $PREV_TAG" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        git log --pretty=format:"- %s (%h)" $PREV_TAG..$CI_COMMIT_TAG >> CHANGELOG.md
      fi
      
      # Add merge requests if any
      echo "" >> CHANGELOG.md
      echo "## Merge Requests" >> CHANGELOG.md
      echo "" >> CHANGELOG.md
      if [ -z "$PREV_TAG" ]; then
        git log --merges --pretty=format:"- %s (%h)" $CI_COMMIT_TAG >> CHANGELOG.md || echo "No merge requests found" >> CHANGELOG.md
      else
        git log --merges --pretty=format:"- %s (%h)" $PREV_TAG..$CI_COMMIT_TAG >> CHANGELOG.md || echo "No merge requests found" >> CHANGELOG.md
      fi
      
      # Build complete release description
      cat > RELEASE_NOTES.md << EOF
      Release ${CI_COMMIT_TAG} of Pandoc Documentation Creator
      
      ## Docker Image
      
      \`\`\`bash
      docker pull ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
      docker pull ${CI_REGISTRY_IMAGE}:latest
      \`\`\`
      
      EOF
      
      # Append changelog
      cat CHANGELOG.md >> RELEASE_NOTES.md
      
      # Append Quick Start and Usage
      cat >> RELEASE_NOTES.md << 'EOF'
      
      ## Quick Start
      
      \`\`\`bash
      # Pull the image
      docker pull ${CI_REGISTRY_IMAGE}:latest
      
      # Run init script
      curl -fsSL https://gitlab.com/woofi4/public/pandoc-documentation-creator/-/raw/main/scripts/init.sh | bash
      
      # Build your documentation
      ./build-pdf.sh
      \`\`\`
      
      ## Usage Example
      
      \`\`\`bash
      docker run --rm -v $(pwd):/data --entrypoint=/bin/sh \
        ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG} \
        -c "pandoc --defaults=/usr/local/share/pandoc/defaults.yaml --metadata-file=/data/metadata.yaml /data/chapters/*.md -o /data/output/documentation.pdf"
      \`\`\`
      EOF
      
      # Expand variables in the Quick Start and Usage sections
      sed -i "s|\${CI_REGISTRY_IMAGE}|${CI_REGISTRY_IMAGE}|g" RELEASE_NOTES.md
      sed -i "s|\${CI_COMMIT_TAG}|${CI_COMMIT_TAG}|g" RELEASE_NOTES.md
      
      # Display the complete release notes
      cat RELEASE_NOTES.md
  release:
    tag_name: $CI_COMMIT_TAG
    description: ./RELEASE_NOTES.md
