stages:
  - validate
  - build
  - scan
  - test
  - release

include:
  - template: Security/Container-Scanning.gitlab-ci.yml

variables:
  DOCKER_LATEST_TAG: $CI_REGISTRY_IMAGE:latest
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  TAG_REGEX: /^v\d+\.\d+\.\d+(\.\d+)?$/

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ $TAG_REGEX
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

# ------------------------
# VALIDATION
# ------------------------
validate_scripts:
  stage: validate
  image: koalaman/shellcheck:stable
  rules:
    - if: $CI_COMMIT_TAG =~ $TAG_REGEX
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - shellcheck init.sh buildPDF scripts/*.sh docker/scripts/*.sh

# ------------------------
# BUILD
# ------------------------
build_docker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_TAG =~ $TAG_REGEX
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Logging into GitLab Container Registry..."
        echo "$CI_REGISTRY_PASSWORD" | docker login \
          -u "$CI_REGISTRY_USER" \
          --password-stdin "$CI_REGISTRY"
      fi

  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Building & pushing Docker image for tag $CI_COMMIT_TAG"
        IMAGE_TAG="${CI_COMMIT_TAG#v}"
        DOCKER_IMAGE_NAME="$CI_REGISTRY_IMAGE:${IMAGE_TAG}"

        docker build \
          --build-arg VERSION="${IMAGE_TAG}" \
          --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          --build-arg VCS_REF="$CI_COMMIT_SHA" \
          --build-arg VCS_URL="$CI_PROJECT_URL" \
          -t "$DOCKER_IMAGE_NAME" \
          -t "$DOCKER_LATEST_TAG" \
          -f docker/Dockerfile .

        docker push "$DOCKER_IMAGE_NAME"
        docker push "$DOCKER_LATEST_TAG"
      else
        echo "Building Docker image for branch / merge request"

        docker build \
          --build-arg VERSION="$CI_COMMIT_SHORT_SHA" \
          --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          --build-arg VCS_REF="$CI_COMMIT_SHA" \
          --build-arg VCS_URL="$CI_PROJECT_URL" \
          -t "pandoc-documentation-creator:$CI_COMMIT_SHORT_SHA" \
          -f docker/Dockerfile .

        docker save \
          "pandoc-documentation-creator:$CI_COMMIT_SHORT_SHA" \
          -o pandoc-image.tar
      fi

  after_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker logout "$CI_REGISTRY" || true
      fi

  artifacts:
    paths:
      - pandoc-image.tar
    expire_in: 1 day
    when: on_success


# ------------------------
# CONTAINER SCANNING
# ------------------------
container_scan:
  stage: scan
  image:
    name: docker.io/aquasec/trivy:latest
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG =~ $TAG_REGEX
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  dependencies:
    - build_docker
  variables:
    # No need to clone the repo, we exclusively work on artifacts. See
    # https://docs.gitlab.com/ee/ci/runners/configure_runners.html#git-strategy
    GIT_STRATEGY: none
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
    FULL_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  script:
    - trivy --version
    # update vulnerabilities db
    - time trivy image --download-db-only
    # Builds report and puts it in the default workdir $CI_PROJECT_DIR, so `artifacts:` can take it from there
    - time trivy image --exit-code 0 --format template --template "@/contrib/gitlab.tpl"
        --output "$CI_PROJECT_DIR/gl-container-scanning-report.json" "$FULL_IMAGE_NAME"
    # Prints full report
    - time trivy image --exit-code 0 "$FULL_IMAGE_NAME"
    # Fail on critical vulnerabilities
    - time trivy image --exit-code 1 --severity CRITICAL "$FULL_IMAGE_NAME"
  cache:
    paths:
      - .trivycache/
  # Enables https://docs.gitlab.com/ee/user/application_security/container_scanning/ (Container Scanning report is available on GitLab EE Ultimate or GitLab.com Gold)
  artifacts:
    when:                          always
    reports:
      container_scanning:          gl-container-scanning-report.json
  tags:
    - docker-runner


# ------------------------
# TEST
# ------------------------
test_docker:
  stage: test
  image: docker:24-dind
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_TAG =~ $TAG_REGEX
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  dependencies:
    - build_docker

  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="${CI_COMMIT_TAG#v}"
        DOCKER_IMAGE_NAME="$CI_REGISTRY_IMAGE:${IMAGE_TAG}"
        echo "Testing image from registry: $DOCKER_IMAGE_NAME"

        echo "$CI_REGISTRY_PASSWORD" | docker login \
          -u "$CI_REGISTRY_USER" \
          --password-stdin "$CI_REGISTRY"

        docker pull "$DOCKER_IMAGE_NAME"
        TEST_IMAGE="$DOCKER_IMAGE_NAME"

        docker logout "$CI_REGISTRY"
      else
        echo "Loading Docker image from artifact"
        docker load -i pandoc-image.tar
        TEST_IMAGE="pandoc-documentation-creator:$CI_COMMIT_SHORT_SHA"
      fi

    - docker run --rm "$TEST_IMAGE" pandoc --version
    - docker run --rm "$TEST_IMAGE" xelatex --version
    - docker run --rm "$TEST_IMAGE" python3 --version
    - docker run --rm "$TEST_IMAGE" node --version
    - docker run --rm "$TEST_IMAGE" mermaid --version || echo "Mermaid skipped"
    - |
      echo "Building sample PDF to validate pipeline"
      rm -f "$CI_PROJECT_DIR/out/ci-test.pdf" || true
      docker run --rm \
        -v "$CI_PROJECT_DIR:/data" \
        -e OUTPUT_NAME="ci-test" \
        -e INPUT_FILES="/data/examples/advanced/deckblatt.md /data/examples/advanced/documentation.md" \
        "$TEST_IMAGE" \
        /data/buildPDF
      test -f "$CI_PROJECT_DIR/out/ci-test.pdf"
  artifacts:
    untracked: false
    when: on_success
    access: all
    expire_in: "30 days"
    paths:
      - $CI_PROJECT_DIR/out/ci-test.pdf

# ------------------------
# RELEASE
# ------------------------
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_docker
    - job: test_docker
  script:
    - echo "Creating release for tag $CI_COMMIT_TAG"
    - apk add --no-cache gettext
    - envsubst '$CI_COMMIT_TAG $CI_REGISTRY_IMAGE' < .gitlab/release_notes.md > release_description.md
    - cat release_description.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: release_description.md
    assets:
      links:
        - name: "Docker Image: pandoc-documentation-creator-$CI_COMMIT_TAG"

          url: "https://$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"
          link_type: image
  rules:
    - if: $CI_COMMIT_TAG
