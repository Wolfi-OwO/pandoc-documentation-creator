stages:
  - build
  - test
  - release

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  DOCKER_LATEST_TAG: $CI_REGISTRY_IMAGE:latest
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  TAG_REGEX: $TAG_REGEX

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ $TAG_REGEX
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

# ------------------------
# BUILD
# ------------------------
build_docker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_TAG =~ $TAG_REGEX
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Logging into GitLab Container Registry..."
        echo "$CI_REGISTRY_PASSWORD" | docker login \
          -u "$CI_REGISTRY_USER" \
          --password-stdin "$CI_REGISTRY"
      fi

  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Building & pushing Docker image for tag $CI_COMMIT_TAG"

        docker build \
          --build-arg VERSION="${CI_COMMIT_TAG#v}" \
          --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          --build-arg VCS_REF="$CI_COMMIT_SHA" \
          --build-arg VCS_URL="$CI_PROJECT_URL" \
          -t "$DOCKER_IMAGE_NAME" \
          -t "$DOCKER_LATEST_TAG" \
          -f docker/Dockerfile .

        docker push "$DOCKER_IMAGE_NAME"
        docker push "$DOCKER_LATEST_TAG"
      else
        echo "Building Docker image for branch / merge request"

        docker build \
          --build-arg VERSION="$CI_COMMIT_SHORT_SHA" \
          --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          --build-arg VCS_REF="$CI_COMMIT_SHA" \
          --build-arg VCS_URL="$CI_PROJECT_URL" \
          -t "pandoc-documentation-creator:$CI_COMMIT_SHORT_SHA" \
          -f docker/Dockerfile .

        docker save \
          "pandoc-documentation-creator:$CI_COMMIT_SHORT_SHA" \
          -o pandoc-image.tar
      fi

  after_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker logout "$CI_REGISTRY" || true
      fi

  artifacts:
    paths:
      - pandoc-image.tar
    expire_in: 1 day
    when: on_success


# ------------------------
# TEST
# ------------------------
test_docker:
  stage: test
  image: docker:24-dind
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_TAG =~ $TAG_REGEX
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  dependencies:
    - build_docker

  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Testing image from registry: $DOCKER_IMAGE_NAME"

        echo "$CI_REGISTRY_PASSWORD" | docker login \
          -u "$CI_REGISTRY_USER" \
          --password-stdin "$CI_REGISTRY"

        docker pull "$DOCKER_IMAGE_NAME"
        TEST_IMAGE="$DOCKER_IMAGE_NAME"

        docker logout "$CI_REGISTRY"
      else
        echo "Loading Docker image from artifact"
        docker load -i pandoc-image.tar
        TEST_IMAGE="pandoc-documentation-creator:$CI_COMMIT_SHORT_SHA"
      fi

    - docker run --rm "$TEST_IMAGE" pandoc --version
    - docker run --rm "$TEST_IMAGE" xelatex --version
    - docker run --rm "$TEST_IMAGE" python3 --version
    - docker run --rm "$TEST_IMAGE" node --version
    - docker run --rm "$TEST_IMAGE" mermaid --version || echo "Mermaid skipped"


# ------------------------
# RELEASE
# ------------------------
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ $TAG_REGEX
  before_script:
    - apk add --no-cache git
  script:
    - echo "Creating release $CI_COMMIT_TAG"

    - |
      PREV_TAG=$(git describe --tags --abbrev=0 "$CI_COMMIT_TAG^" 2>/dev/null || echo "")

      if [ -z "$PREV_TAG" ]; then
        echo "## Changes" > CHANGELOG.md
        git log --pretty=format:"- %s (%h)" "$CI_COMMIT_TAG" >> CHANGELOG.md
      else
        echo "## Changes since $PREV_TAG" > CHANGELOG.md
        git log --pretty=format:"- %s (%h)" "$PREV_TAG..$CI_COMMIT_TAG" >> CHANGELOG.md
      fi

      cat > RELEASE_NOTES.md << EOF
      Release ${CI_COMMIT_TAG} of Pandoc Documentation Creator

      ## Docker Image

      \`\`\`bash
      docker pull ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
      docker pull ${CI_REGISTRY_IMAGE}:latest
      \`\`\`

      EOF

      cat CHANGELOG.md >> RELEASE_NOTES.md
      cat RELEASE_NOTES.md

      export RELEASE_NOTES="$(cat RELEASE_NOTES.md)"
  release:
    tag_name: $CI_COMMIT_TAG
    description: $RELEASE_NOTES
