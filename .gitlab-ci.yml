stages:
  - validate_and_security
  - build
  - scan_and_test
  - push_image
  - release

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

  TAG_REGEX: "/^v\\d+\\.\\d+\\.\\d+(\\.\\d+)?$/"

  CS_SEVERITY_THRESHOLD: CRITICAL
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: ".trivycache/"

include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml

workflow:
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never

# --------------------
# Secret Detection
# --------------------
secret_detection:
  stage: validate_and_security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never
  script:
    - gitleaks detect --source . --report-format json --report-path gl-secret-report.json
  artifacts:
    when: always
    reports:
      secret_detection: gl-secret-report.json

# --------------------
# SAST (Semgrep)
# --------------------
sast:
  stage: validate_and_security
  image:
    name: returntocorp/semgrep
    entrypoint: [""]
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never
  script:
    - |
      semgrep scan \
        --config auto \
        --json \
        --severity ERROR \
        --project-dir "$CI_PROJECT_DIR" \
        > gl-sast-report.json || true
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json

# --------------------
# Dependency Scanning
# --------------------

dependency_scanning:
  stage: scan_and_test

# --------------------
# Build Docker Image
# --------------------
build_docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login \
          -u "$CI_REGISTRY_USER" \
          --password-stdin "$CI_REGISTRY"
      fi

  script:
    - |
      docker build \
        --build-arg VERSION="$CI_COMMIT_SHORT_SHA" \
        --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        --build-arg VCS_URL="$CI_PROJECT_URL" \
        -t "pandoc-documentation-creator:local" \
        -f docker/Dockerfile .

      docker save pandoc-documentation-creator:local \
        -o pandoc-image.tar

  after_script:
    - docker logout "$CI_REGISTRY" || true

  artifacts:
    when: on_success
    paths:
      - pandoc-image.tar
    expire_in: 1 day

# --------------------
# Container Scanning (Trivy)
# --------------------
container_scan:
  stage: scan_and_test
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - build_docker
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never

  script:
    - |
      IGNORE_FILE_ARG=""
      if [ -f ".trivyignore" ]; then
        IGNORE_FILE_ARG="--ignorefile .trivyignore"
      fi

      docker run --rm \
        -v "$CI_PROJECT_DIR:/work" \
        -v "$CI_PROJECT_DIR/$TRIVY_CACHE_DIR:/root/.cache/" \
        -w /work \
        aquasec/trivy:latest image \
        --format template --template "@/contrib/gitlab.tpl" \
        --output gl-container-scanning-report.json \
        --severity CRITICAL,HIGH,MEDIUM \
        --exit-code 1 \
        $IGNORE_FILE_ARG \
        --input pandoc-image.tar

  cache:
    paths:
      - .trivycache/

  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json

# --------------------
# Test Docker Image
# --------------------
test_docker:
  stage: scan_and_test
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - build_docker
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never

  script:
    - |
      docker load -i pandoc-image.tar
      TEST_IMAGE="pandoc-documentation-creator:local"

    - docker run --rm "$TEST_IMAGE" pandoc --version
    - docker run --rm "$TEST_IMAGE" xelatex --version
    - docker run --rm "$TEST_IMAGE" python3 --version
    - docker run --rm "$TEST_IMAGE" node --version
    - docker run --rm "$TEST_IMAGE" mermaid --version || true

    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/data" \
        -e OUTPUT_NAME="ci-test" \
        -e INPUT_FILES="/data/examples/advanced/deckblatt.md /data/examples/advanced/documentation.md" \
        --entrypoint /bin/sh \
        "$TEST_IMAGE" \
        -c "/data/buildPDF"

      test -f "$CI_PROJECT_DIR/out/ci-test.pdf"

  artifacts:
    paths:
      - out/ci-test.pdf
    expire_in: 30 days

# --------------------
# Push to Registry
# --------------------

push_to_registry:
  stage: push_image
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - test_docker
    - container_scan
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - when: never
  script:
    - |
      docker load -i pandoc-image.tar

      IMAGE_TAG="${CI_COMMIT_TAG#v}"
      IMAGE="$CI_REGISTRY_IMAGE:$IMAGE_TAG"

      docker tag pandoc-documentation-creator:local $IMAGE
      docker tag pandoc-documentation-creator:local ${CI_REGISTRY_IMAGE}:latest

      docker push "$IMAGE"
      docker push "$CI_REGISTRY_IMAGE:latest"

# --------------------
# Release
# --------------------
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - push_to_registry
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - apk add --no-cache gettext
    - export TAG_NO_V="${CI_COMMIT_TAG#v}"
    - envsubst < .gitlab/release_notes.md > release_description.md
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: release_description.md
    assets:
      links:
        - name: "Docker Image"
          url: "https://$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"
          link_type: image
