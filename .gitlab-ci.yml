stages:
  - validate
  - build
  - scan
  - test
  - release

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

  # Tag format: v1.2.3 or v1.2.3.4
  TAG_REGEX: "/^v\\d+\\.\\d+\\.\\d+(\\.\\d+)?$/"

  # Container Scanning template variables
  CS_ANALYZER_IMAGE: registry.gitlab.com/gitlab-org/security-products/container-scanning:latest
  CS_SEVERITY_THRESHOLD: CRITICAL

workflow:
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never

# --------------------
# Build Docker Image
# --------------------
build_docker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login \
          -u "$CI_REGISTRY_USER" \
          --password-stdin "$CI_REGISTRY"
      fi

  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="${CI_COMMIT_TAG#v}"
        IMAGE="$CI_REGISTRY_IMAGE:$IMAGE_TAG"

        docker build \
          --build-arg VERSION="$IMAGE_TAG" \
          --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          --build-arg VCS_REF="$CI_COMMIT_SHA" \
          --build-arg VCS_URL="$CI_PROJECT_URL" \
          -t "$IMAGE" \
          -t "$CI_REGISTRY_IMAGE:latest" \
          -f docker/Dockerfile .

        docker push "$IMAGE"
        docker push "$CI_REGISTRY_IMAGE:latest"
      else
        docker build \
          --build-arg VERSION="$CI_COMMIT_SHORT_SHA" \
          --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          --build-arg VCS_REF="$CI_COMMIT_SHA" \
          --build-arg VCS_URL="$CI_PROJECT_URL" \
          -t "pandoc-documentation-creator:$CI_COMMIT_SHORT_SHA" \
          -f docker/Dockerfile .

        docker save pandoc-documentation-creator:$CI_COMMIT_SHORT_SHA \
          -o pandoc-image.tar
      fi

  after_script:
    - docker logout "$CI_REGISTRY" || true

  artifacts:
    paths:
      - pandoc-image.tar
    expire_in: 1 day
    when: on_success

# --------------------
# Container Scanning (MR/branch - local image tar)
# --------------------
container_scan_mr:
  stage: scan
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  dependencies:
    - build_docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  script:
    - |
      IGNORE_FILE_ARG=""
      if [ -f "$CI_PROJECT_DIR/.trivyignore" ]; then
        IGNORE_FILE_ARG="--ignorefile $CI_PROJECT_DIR/.trivyignore"
      fi
      docker run --rm \
        -v "$CI_PROJECT_DIR:/work" \
        -v "$CI_PROJECT_DIR/$TRIVY_CACHE_DIR:/root/.cache/" \
        -w /work \
        aquasec/trivy:latest image --scanners vuln --vuln-type os,library \
        --format template --template "@/contrib/gitlab.tpl" \
        --output /work/gl-container-scanning-report.json --exit-code 0 \
        --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --no-progress --list-all-pkgs=false \
        $IGNORE_FILE_ARG --input /work/pandoc-image.tar
  cache:
    paths:
      - .trivycache/
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json

# --------------------
# Test Docker Image
# --------------------
test_docker:
  stage: test
  image: docker:24-dind
  services:
    - docker:24-dind
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

  dependencies:
    - build_docker

  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE="$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"

        echo "$CI_REGISTRY_PASSWORD" | docker login \
          -u "$CI_REGISTRY_USER" \
          --password-stdin "$CI_REGISTRY"

        docker pull "$IMAGE"
        TEST_IMAGE="$IMAGE"
        docker logout "$CI_REGISTRY"
      else
        docker load -i pandoc-image.tar
        TEST_IMAGE="pandoc-documentation-creator:$CI_COMMIT_SHORT_SHA"
      fi

    - docker run --rm "$TEST_IMAGE" pandoc --version
    - docker run --rm "$TEST_IMAGE" xelatex --version
    - docker run --rm "$TEST_IMAGE" python3 --version
    - docker run --rm "$TEST_IMAGE" node --version
    - docker run --rm "$TEST_IMAGE" mermaid --version || true

    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/data" \
        -e OUTPUT_NAME="ci-test" \
        -e INPUT_FILES="/data/examples/advanced/deckblatt.md /data/examples/advanced/documentation.md" \
        --entrypoint /bin/sh \
        "$TEST_IMAGE" \
        -c "/data/buildPDF"

      test -f "$CI_PROJECT_DIR/out/ci-test.pdf"

  artifacts:
    paths:
      - out/ci-test.pdf
    expire_in: 30 days

# --------------------
# Release
# --------------------
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build_docker
    - job: test_docker
      optional: true

  rules:
    - if: "$CI_COMMIT_TAG"

  script:
    - apk add --no-cache gettext
    - envsubst '$CI_COMMIT_TAG $CI_REGISTRY_IMAGE' < .gitlab/release_notes.md > release_description.md

  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: release_description.md
    assets:
      links:
        - name: "Docker Image"
          url: "https://$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"
          link_type: image
